name: Bootstrap Windows check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bootstrap-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bootstrap-check:
    name: Bootstrap and compile checks
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Zlet Limits with upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Zlet bootstrap
        shell: powershell
        run: .\scripts\bootstrap.ps1

      - name: Verify Zlet product metadata
        shell: powershell
        run: |
          $configPath = '.work\zlet-limits\apps\desktop-tauri\src-tauri\tauri.conf.json'
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          if ($config.productName -ne 'Zlet Limits') { throw "Unexpected productName: $($config.productName)" }
          if ($config.identifier -ne 'app.zlet.limits') { throw "Unexpected identifier: $($config.identifier)" }
          $mainWindow = @($config.app.windows) | Where-Object { $_.label -eq 'main' } | Select-Object -First 1
          if ($null -eq $mainWindow -or $mainWindow.title -ne 'Zlet Limits') { throw 'Main window was not rebranded.' }

          $marker = Get-Content -Raw '.work\zlet-limits\.zlet-bootstrap.json' | ConvertFrom-Json
          if ($marker.upstream_commit -ne 'bdf0773f66c60810886037cfe5f160e0a9fa4fe7') { throw 'Unexpected upstream bootstrap commit.' }

      - name: Install frontend dependencies
        run: pnpm --dir .work/zlet-limits/apps/desktop-tauri install --frozen-lockfile

      - name: Rust format check
        working-directory: .work/zlet-limits
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: .work/zlet-limits
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: .work/zlet-limits
        run: cargo test --workspace

      - name: Frontend tests
        run: pnpm --dir .work/zlet-limits/apps/desktop-tauri test

      - name: Frontend build
        run: pnpm --dir .work/zlet-limits/apps/desktop-tauri run build
